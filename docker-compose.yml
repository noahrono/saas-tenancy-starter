services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: central
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    image: node:24
    working_dir: /app
    command: sh -c "npm ci && npm run migrate:central && npm run dev"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/central
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: "5432"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
